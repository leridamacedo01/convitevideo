<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite em video</title>
    <style>
        /* Deixa a tela preta e o vídeo centralizado */
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        video {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <video controls autoplay muted playsinline>
        <source src="video.mp4" type="video/mp4">
        Seu navegador não suporta vídeos.
    </video>

</body>
</html>
